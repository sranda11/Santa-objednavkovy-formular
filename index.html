<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santov objednávací formulár</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Santov formulár">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --night:#0f1b33; --night2:#1a2b4f; --card:#22345c; --snow:#f7f9ff; --muted:#b4c2e3;
  --red:#e5334b; --green:#2fa968; --gold:#ffcf4a; --pine:#14573f;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--snow);
  background:radial-gradient(120% 70% at 50% 0%,var(--night2),var(--night) 70%) fixed;overflow-x:hidden}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:20px 16px 120px}
.lights{display:flex;justify-content:center;gap:14px;margin:4px 0 10px}
.lights i{width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:blink 1.8s infinite}
.lights i:nth-child(4n+1){background:var(--red)}.lights i:nth-child(4n+2){background:var(--gold)}
.lights i:nth-child(4n+3){background:var(--green)}.lights i:nth-child(4n){background:#5ab4ff}
.lights i:nth-child(odd){animation-delay:.9s}
@keyframes blink{50%{opacity:.35;transform:scale(.88)}}
h1{font-size:1.9rem;line-height:1.1;text-align:center;margin:6px 0 4px;color:var(--gold);font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.panel{background:rgba(34,52,92,.85);border:2px solid rgba(255,255,255,.1);border-radius:24px;padding:22px 18px;backdrop-filter:blur(4px)}
.panel h2{margin:0 0 6px;font-size:1.35rem;text-align:center}
.q{font-size:1.5rem;font-weight:600;text-align:center;margin:14px 0 22px}
.btnrow{display:flex;flex-direction:column;gap:14px;align-items:stretch;min-height:150px}
.btn{font:inherit;font-weight:600;font-size:1.1rem;border:0;border-radius:16px;padding:16px 18px;color:#fff;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn:focus-visible,.tab:focus-visible,.sw:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.yes{background:var(--green)}.no{background:var(--red)}
.no.jump{position:fixed;z-index:20;width:auto;max-width:78vw;transition:left .25s cubic-bezier(.3,1.6,.5,1),top .25s cubic-bezier(.3,1.6,.5,1)}
.hide{display:none!important}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:18px;margin:12px 0 16px}
.tab{flex:1;font:inherit;font-weight:600;font-size:.82rem;line-height:1.15;border:0;border-radius:14px;padding:10px 4px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected=true]{background:var(--gold);color:#3a2a00}
.gift{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:16px;border:2px solid transparent;transition:border-color .2s,transform .2s;display:grid;grid-template-columns:1fr 26%;column-gap:12px;padding:14px 14px 16px}
.gift.on{border-color:var(--gold);transform:scale(1.01)}
.pic{grid-column:2;grid-row:1 / span 2;align-self:start;aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;place-items:center;font-size:2.4rem;position:relative}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.pic span{filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.gift.on .gb h3::after{content:" \1F381"}
.gb{display:contents}
.gb h3{grid-column:1;grid-row:1;margin:0 0 6px;font-size:1.1rem;line-height:1.2}
.gb p{grid-column:1;grid-row:2;margin:0 0 14px;color:var(--muted);line-height:1.4;font-size:.95rem}
.acts{grid-column:1 / -1;grid-row:3;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.shop{color:var(--snow);font-weight:600;text-decoration:none;border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 12px;font-size:.92rem}
.sw{display:flex;align-items:center;gap:8px;font:inherit;font-weight:600;font-size:.92rem;background:none;border:0;color:var(--snow);cursor:pointer;padding:4px}
.sw .t{width:48px;height:28px;border-radius:99px;background:#4a5a82;position:relative;transition:background .2s}
.sw .t::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true] .t{background:var(--green)}.sw[aria-checked=true] .t::after{transform:translateX(20px)}
#float{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;
  background:linear-gradient(transparent,var(--night) 55%)}
#float .btn{width:100%;max-width:528px;background:var(--red);font-size:1.05rem;animation:pulse 2.2s infinite}
@keyframes pulse{50%{transform:scale(1.025)}}
.cert{background:#fffaf0;color:#3b2a14;border-radius:20px;padding:26px 20px;border:6px double #c9a24a;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7) rotate(-3deg);opacity:0}}
.cert h2{color:#a8182c;font-size:1.7rem;margin:4px 0 6px;line-height:1.1}
.cert .seal{font-size:2.6rem}
.cert p{margin:6px 0;line-height:1.4}
.cert ul{list-style:none;padding:0;margin:14px 0;text-align:left}
.cert li{padding:10px 0;border-top:1px dashed #c9a24a}
.cert li b{display:block}
.cert li a{color:#a8182c;font-size:.9rem;word-break:break-all}
.cert .sig{font-weight:600;margin-top:16px}
.cert .btn{margin-top:8px;width:100%}
.cert .ghost{background:transparent;color:#6b5a3e;box-shadow:none;font-size:.95rem}
.wheelbox{text-align:center}
.wtitle{font-weight:600;font-size:1.1rem;margin:0 0 10px}
.wrap{position:relative;width:min(100%,320px);margin:14px auto 18px}
.wrap canvas{width:100%;height:auto;display:block;border-radius:50%;border:6px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ptr{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:2rem;line-height:1;color:var(--snow);z-index:3;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.quip{background:rgba(255,207,74,.15);border:2px dashed var(--gold);border-radius:16px;padding:12px;margin:16px 0 12px;font-weight:600;color:var(--gold)}
.wheelbox .gift{text-align:left}
.num{position:absolute;top:4px;left:4px;z-index:2;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:600}
.btn:disabled{opacity:.6}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#3a2a00;font-weight:600;padding:10px 18px;border-radius:99px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw;text-align:center}

.trap{display:flex;align-items:center;justify-content:center;gap:18px;margin:28px 0 8px}
.trap small{display:block;text-align:center;color:var(--muted);font-size:.72rem;margin-top:14px;max-width:130px}
.gr{width:84px;height:auto;flex:none;transform:scaleX(-1);filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.btn3d{position:relative;display:block;width:118px;height:112px;margin:0 auto;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;animation:glow 1.8s infinite}
.btn3d .base{position:absolute;left:0;right:0;bottom:0;height:70px;border-radius:50%;background:linear-gradient(#f4f5f7,#aab0b8 45%,#6c727b);box-shadow:0 9px 0 #4d5259,0 16px 18px rgba(0,0,0,.5),inset 0 3px 2px rgba(255,255,255,.9)}
.btn3d .hole{position:absolute;left:9px;right:9px;bottom:12px;height:50px;border-radius:50%;background:linear-gradient(#2b2f35,#12141a)}
.btn3d .cap{position:absolute;left:11px;right:11px;top:6px;height:76px;border-radius:50%/52%;background:radial-gradient(ellipse at 34% 22%,#ffb1b9 0,#ff4558 20%,#d5141f 52%,#930b18);box-shadow:inset 0 -9px 10px rgba(90,0,12,.6),0 10px 0 #a50f1d,0 14px 8px rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;font:700 .74rem/1.15 "Fredoka",sans-serif;letter-spacing:.05em;text-shadow:0 1px 2px rgba(80,0,10,.8);transition:transform .08s,box-shadow .08s}
.btn3d .cap::before{content:"";position:absolute;left:14%;top:9%;width:38%;height:22%;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1.5px);transform:rotate(-14deg)}
.btn3d:active .cap{transform:translateY(9px);box-shadow:inset 0 -6px 8px rgba(90,0,12,.55),0 1px 0 #a50f1d}
@keyframes glow{50%{filter:drop-shadow(0 0 14px rgba(255,70,90,.9))}}
#disco{position:fixed;inset:0;z-index:100;display:none;overflow:hidden;touch-action:none;opacity:1;transition:opacity 1.3s ease}
#disco.show{display:block}#disco.out{opacity:0}
#disco .dim{position:absolute;inset:0;background:rgba(4,3,12,.62);opacity:0;transition:opacity .5s}
#disco.on .dim{opacity:1}
#disco .strobe{position:absolute;inset:0;mix-blend-mode:screen;opacity:.22;animation:strobe .94s steps(1) infinite}
@keyframes strobe{0%{background:#ff2e93}25%{background:#2ee6ff}50%{background:#ffe62e}75%{background:#7dff2e}}
#disco .beam{position:absolute;top:92px;left:50%;width:150px;height:125vh;margin-left:-75px;transform-origin:50% 0;clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);mix-blend-mode:screen;opacity:.7;animation:sweep 2s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
#disco .ballstr{position:absolute;top:0;left:50%;width:2px;height:40px;margin-left:-1px;background:#aab}
#disco .ball{position:absolute;top:34px;left:50%;width:116px;height:116px;margin-left:-58px;border-radius:50%;
 background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(190,200,230,.7) 28%,rgba(70,80,120,.9) 70%,#1a1e3a),repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 2px,transparent 2px 13px),repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 2px,transparent 2px 13px);
 box-shadow:0 0 44px 14px rgba(255,255,255,.35);animation:ballsway 1.4s ease-in-out infinite alternate}
@keyframes ballsway{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.05)}}
#disco .gh{position:fixed;left:6px;width:150px;z-index:6;transition:top 1s cubic-bezier(.4,.1,.3,1)}
#disco .gm{position:relative;isolation:isolate;animation:tiptoe .5s ease-in-out infinite}
@keyframes tiptoe{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
#disco .gi{display:block;width:100%;height:auto;position:relative;z-index:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
#disco .sackw{position:absolute;left:58%;top:12%;width:62%;z-index:0;transform-origin:30% 100%;transition:transform .2s}
#disco .sackw.bump{transform:scale(1.12) rotate(5deg)}
#disco .sackw svg{width:100%;display:block}
#disco .peek{position:absolute;left:10%;right:10%;top:-16px;height:34px}
#disco .peek span{position:absolute;bottom:0;font-size:1.6rem;line-height:1}
#disco .say{position:absolute;left:0;top:-46px;background:#fff;color:#222;font-weight:700;padding:7px 13px;border-radius:14px;white-space:nowrap;font-size:.9rem;opacity:0;transition:opacity .2s;z-index:3}
#disco .say.show{opacity:1}
#disco .cl{position:fixed;margin:0;z-index:5;transition:transform .65s cubic-bezier(.5,0,.8,.45),opacity .65s;pointer-events:none}
.popin{animation:popin .55s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes popin{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>
<main>
  <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <h1>Santov objednávací formulár</h1>
  <p class="sub">Oficiálna aplikácia Severného pólu</p>

  <section id="s1" class="panel">
    
    <p class="q">Bol tvoj manžel tento rok dobrý?</p>
    <div class="btnrow" id="row">
      <button class="btn yes" id="yes">Áno, absolútne dokonalý</button>
      <button class="btn no" id="no">No, dalo by sa zlepšiť</button>
    </div>
  </section>

  <section id="s2" class="hide">
    <div class="panel">
      <h2>Vyber darčeky pre dokonalého manžela</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="list"></div>
    </div>
  </section>

  <section id="s3" class="hide"></section>
</main>
<div id="disco" aria-hidden="true"></div>
<div id="float" class="hide"><button class="btn" id="confirm">Potvrdiť výber pre Ježiška</button></div>

var STORE = "santov-formular-2026";
function savePicked(){
  try{ localStorage.setItem(STORE, JSON.stringify(Object.keys(picked).map(function(k){return picked[k].name}))) }catch(e){}
}
function loadPicked(){
  try{
    var names = JSON.parse(localStorage.getItem(STORE) || "[]");

/* ---------- Sneh ---------- */
var sc = $("snow"), sx = sc.getContext("2d"), flakes = [];
function sizeCanvas(c){c.width = innerWidth; c.height = innerHeight}
function initSnow(){
  sizeCanvas(sc); flakes = [];
  var n = Math.min(90, Math.round(innerWidth/9));
  for(var i=0;i<n;i++) flakes.push({x:Math.random()*sc.width,y:Math.random()*sc.height,r:1+Math.random()*3,v:.4+Math.random()*1.1,p:Math.random()*6});
}
function snowTick(){
  sx.clearRect(0,0,sc.width,sc.height); sx.fillStyle="rgba(255,255,255,.85)";
  flakes.forEach(function(f){
    f.y += f.v; f.p += .02; f.x += Math.sin(f.p)*.5;
    if(f.y > sc.height+5){f.y=-5; f.x=Math.random()*sc.width}
    sx.beginPath(); sx.arc(f.x,f.y,f.r,0,6.3); sx.fill();
  });
  requestAnimationFrame(snowTick);
}
initSnow(); snowTick(); addEventListener("resize", initSnow);

var cc = $("confetti"), cx = cc.getContext("2d"), bits = [], running = false;
function confetti(){
  sizeCanvas(cc);
  var cols = ["#e5334b","#ffcf4a","#2fa968","#5ab4ff","#ffffff","#ff8fb1"];
  for(var s=0;s<2;s++) for(var i=0;i<90;i++){
    var a = (s? Math.PI*.75 : Math.PI*.25) + (Math.random()-.5)*.9, sp = 9+Math.random()*10;
    bits.push({x:s?cc.width:0,y:cc.height*.85,vx:Math.cos(a)*-sp*(s?-1:1)*-1*(s?-1:1),vy:-Math.sin(a)*sp,w:6+Math.random()*7,h:4+Math.random()*6,
      c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:180+Math.random()*60});
  }
  if(!running){running = true; conTick()}
}
function conTick(){
  cx.clearRect(0,0,cc.width,cc.height);
  bits = bits.filter(function(b){return b.life > 0 && b.y < cc.height+20});
  bits.forEach(function(b){
    b.vy += .25; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life--;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.w/2,-b.h/2,b.w,b.h); cx.restore();
  });
  if(bits.length) requestAnimationFrame(conTick); else {running = false; cx.clearRect(0,0,cc.width,cc.height)}
}

var no = $("no");
var lastQuip = -1, lastDodge = 0;
function dodge(e){
  if(e && e.preventDefault) e.preventDefault();
  lastDodge = Date.now();
  var q; do{ q = Math.floor(Math.random()*QUIPS.length) }while(q === lastQuip);
  lastQuip = q;
  no.classList.add("jump");
  no.textContent = QUIPS[q];
  var w = no.offsetWidth, h = no.offsetHeight;
  var x = 10 + Math.random()*Math.max(0, innerWidth - w - 20);
  var y = 70 + Math.random()*Math.max(0, innerHeight - h - 160);
  no.style.left = x + "px"; no.style.top = y + "px";
}
no.addEventListener("pointerenter", function(e){ if(e.pointerType === "mouse") dodge(e) });
no.addEventListener("pointerdown", dodge);
no.addEventListener("click", function(e){ e.preventDefault(); if(Date.now() - lastDodge > 400) dodge(e) });

function buildTabs(){

    var b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role","tab"); b.setAttribute("aria-selected", i === activeTab);

    b.onclick = function(){activeTab = i; buildTabs(); buildList()};
    t.appendChild(b);
  });
}

function buildList(){

    tr.querySelector(".dont").onclick = heist; l.appendChild(tr);
  }
}

function discoMusic(sec){
  var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  try{
    var a = new AC(); if(a.resume) a.resume();
    var t0 = a.currentTime + 0.05, e = 60/128/2;
    var master = a.createGain(); master.gain.setValueAtTime(0.0001,t0);
    master.gain.exponentialRampToValueAtTime(.4,t0+.15); master.gain.setValueAtTime(.4,t0+sec-.7); master.gain.exponentialRampToValueAtTime(.0001,t0+sec);
    master.connect(a.destination);
    var tone = function(type,f,t,d,g,glide){
      var o = a.createOscillator(), v = a.createGain(); o.type = type; o.frequency.setValueAtTime(f,t);
      if(glide) o.frequency.exponentialRampToValueAtTime(glide,t+d);
      v.gain.setValueAtTime(0.0001,t); v.gain.exponentialRampToValueAtTime(g,t+.01); v.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(v); v.connect(master); o.start(t); o.stop(t+d+.02);
    };
    var noise = function(t,d,g,hp){
      var n = Math.floor(a.sampleRate*d), buf = a.createBuffer(1,n,a.sampleRate), data = buf.getChannelData(0);
      for(var i=0;i<n;i++) data[i] = Math.random()*2-1;
      var s = a.createBufferSource(); s.buffer = buf;
      var f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
      var v = a.createGain(); v.gain.setValueAtTime(g,t); v.gain.exponentialRampToValueAtTime(.0001,t+d);
      s.connect(f); f.connect(v); v.connect(master); s.start(t);
    };
    var bass = [55,0,55,82.4,0,55,73.4,65.4];
    var mel = [440,440,523.3,440,587.3,523.3,440,392,440,440,523.3,440,659.3,587.3,523.3,0];
    var steps = Math.floor((sec-.5)/e);
    for(var k=0;k<steps;k++){
      var t = t0 + k*e;
      if(k%2===0) tone("sine",150,t,.18,.9,45); else noise(t,.05,.25,7000);
      if(k%4===2) noise(t,.12,.35,1500);
      if(bass[k%8]) tone("sawtooth",bass[k%8],t,e*.9,.28);
      var m = mel[k%16]; if(m){ if(Math.floor(k/16)%2) m *= 1.189; tone("square",m,t,e*.8,.09) }
    }
    tone("sawtooth",330,t0+sec-1.4,.9,.2,110);
    setTimeout(function(){ try{ a.close() }catch(x){} }, (sec+2)*1000);
  }catch(x){}
}

function scrollAnim(to,ms,done){
  var from = window.pageYOffset, t0 = null;
  if(Math.abs(to-from) < 2){ setTimeout(done, ms*.4); return }
  function f(ts){
    if(t0 === null) t0 = ts;
    var x = Math.min(1,(ts-t0)/ms); window.scrollTo(0, from + (to-from)*easeIO(x));
    if(x < 1) requestAnimationFrame(f); else done();
  }
  requestAnimationFrame(f);
}
function heist(){
  if(heistBusy) return; heistBusy = true;
  var d = $("disco"), cards = [].slice.call($("list").querySelectorAll(".gift"));
  var cols = ["#ff2e93","#2ee6ff","#ffe62e","#7dff2e","#b05cff","#ff8a2e"];

    .sort(function(a,b){ return b.y - a.y });
  var hg = d.querySelector(".gh"), say = d.querySelector(".say"), sackw = d.querySelector(".sackw"), peek = d.querySelector(".peek");

  var T = function(f,ms){ setTimeout(f,ms) };
  var goTo = function(y){ hg.style.top = Math.max(70, y - GH*.26) + "px" };
  var maxS = function(){ return Math.max(0, document.documentElement.scrollHeight - innerHeight) };
  var n = items.length, D = 1100 + n*1750 + 2400;
  discoMusic(D/1000 + .8);

  function steal(c,i){
    say.textContent = GRAB[i % GRAB.length]; say.classList.add("show");
    c.style.transition = "opacity .35s, transform .35s, filter .35s";
    c.style.opacity = ".3"; c.style.filter = "brightness(1.8) saturate(1.6)";
    T(function(){ c.style.opacity = "0"; c.style.transform = "scale(.92)" }, 350);
    T(function(){
      sackw.classList.add("bump"); T(function(){ sackw.classList.remove("bump") }, 220);
      var sp = document.createElement("span"); sp.textContent = PEEK[i % PEEK.length];
      sp.style.left = (6 + (i*23)%62) + "%"; sp.style.transform = "rotate(" + ((i%2 ? 1 : -1)*(10 + (i%5)*6)) + "deg)"; peek.appendChild(sp);
    }, 450);
  }
  function step(i){
    if(i >= n) return finish();
    var c = items[i].c, r = c.getBoundingClientRect();
    var target = Math.max(0, Math.min(r.top + window.pageYOffset + r.height/2 - handY, maxS()));
    scrollAnim(target, 800, function(){
      var r2 = c.getBoundingClientRect(); goTo(r2.top + r2.height/2);
      T(function(){ steal(c,i); T(function(){ step(i+1) }, 700) }, 250);
    });
  }
  T(function(){ step(0) }, 1100);
  function finish(){
    say.textContent = "Vianoce sú moje! Mwahaha!"; say.classList.add("show");
    T(function(){ hg.style.transition = "top 1.4s cubic-bezier(.5,0,.9,.5)"; hg.style.top = -(GH + 80) + "px" }, 1000);

      d.classList.add("out");
      buildList();
      [].slice.call($("list").querySelectorAll(".gift")).forEach(function(c,i){ c.style.animationDelay = (i*70) + "ms"; c.classList.add("popin") });
    }, 2400);
    T(function(){ d.className = ""; d.innerHTML = ""; heistBusy = false }, 3900);
  }
}

function drawWheel(A){
  var cv = $("wheel"), x = cv.getContext("2d"), n = A.length, seg = Math.PI*2/n, R = 160;
  var cols = ["#e5334b","#2fa968","#ffcf4a","#3b82d9"];

  x.clearRect(0,0,320,320); x.save(); x.translate(160,160);
  A.forEach(function(it,i){
    var s = i*seg - Math.PI/2;
    var col = cols[i%cols.length];

    var nf = Math.max(12, Math.min(24, Math.round(arc(R*.8)*.6)));
    var nr = showEmoji ? R*.84 : R*.72;
    x.save(); x.translate(nr,0); x.rotate(Math.PI/2);
    x.font = "700 " + (showEmoji ? nf : Math.min(26, nf+4)) + "px Fredoka, sans-serif";
    x.lineWidth = 4; x.strokeStyle = "rgba(15,27,51,.75)"; x.fillStyle = "#fff";
    x.strokeText(String(i+1),0,0); x.fillText(String(i+1),0,0); x.restore();
    if(showEmoji){
      var ef = Math.max(14, Math.min(36, Math.round(arc(R*.55)*.75)));
      x.translate(R*.52,0); x.rotate(Math.PI/2);
      x.font = ef + "px sans-serif"; x.fillText(it.g.emoji,0,0);
    }
    x.restore();
  });
  x.beginPath(); x.arc(0,0,26,0,6.3); x.fillStyle = "#fffaf0"; x.fill();
  x.font = "28px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("\ud83c\udf85",0,2);
  x.restore();
}
function buildWheel(l){
  var A = allGifts(), n = A.length;
  l.innerHTML = '<div class="wheelbox"><p class="wtitle">Nechaj rozhodnúť osud (a svoju peňaženku)</p>' +
    '<div class="wrap"><div class="ptr">▼</div><canvas id="wheel" width="320" height="320"></canvas></div>' +
    '<div id="wq"></div>' +
    '<button class="btn yes" id="spin">' + (wheelPick === null ? "Zatočiť kolesom" : "Zatočiť znova (veď čo už)") + '</button><div id="wres"></div></div>';
  drawWheel(A);
  var cv = $("wheel"), sp = $("spin");
  cv.style.transform = "rotate(" + wheelRot + "deg)";
  sp.disabled = wheelBusy;
  sp.onclick = function(){
    if(wheelBusy) return;
    wheelBusy = true; sp.disabled = true; $("wres").innerHTML = ""; $("wq").innerHTML = "";
    var i = Math.floor(Math.random()*n), seg = 360/n, off = (Math.random()-.5)*seg*.6;
    var target = 360 - ((i+.5)*seg + off), cur = ((wheelRot%360)+360)%360;
    var delta = (((target-cur)%360)+360)%360;
    wheelRot += 1800 + delta;
    cv.style.transition = "none"; void cv.offsetWidth;
    cv.style.transition = "transform 4.2s cubic-bezier(.12,.7,.1,1)"; void cv.offsetWidth;
    cv.style.transform = "rotate(" + wheelRot + "deg)";
    var prev = wheelPick;
    if(prev === null){ wheelQ = ""; }
    else {
      var fw = (allGifts()[prev].g.name.split(/\s+/)[0] || "").replace(/[.,;:!?()]/g,"");
      var q = 0, msg;
      if(prev === i){ msg = WSAME; }
      else { do{ q = Math.floor(Math.random()*WQ.length) }while(q === lastQ); lastQ = q; msg = WQ[q]; }
      wheelQ = msg.split("{p}").join("\u201e" + fw + "\u201c");
    }
    var finished = false;
    function done(){
      if(finished) return; finished = true;
      wheelBusy = false; wheelPick = i; wheelSpins++;
      var s = $("spin"); if(s){ s.disabled = false; s.textContent = "Zatočiť znova (veď čo už)" }
      showWheelResult(); confetti2();
      var w = $("wq"); if(w && w.scrollIntoView) w.scrollIntoView({behavior:"smooth", block:"center"});
    }
    cv.addEventListener("transitionend", done, {once:true});
    setTimeout(done, 4350);
  };
  showWheelResult();
}
function showWheelResult(){
  var el = $("wres"); if(!el || wheelPick === null || wheelBusy) return;
  var x = allGifts()[wheelPick], g = x.g, on = !!picked[x.key];
  var wq = $("wq"); if(wq) wq.innerHTML = wheelSpins > 1 ? '<div class="quip">' + esc(wheelQ) + '</div>' : "";
  el.innerHTML = '<article class="gift' + (on ? ' on' : '') + '"><div class="pic" style="background:linear-gradient(135deg,' + x.color + ',#0f1b33)"><b class="num">\u010d. ' + (wheelPick+1) + '</b>' + picIn(g) + '</div>' +
    '<div class="gb"><h3>' + esc(g.name) + '</h3><p>' + esc(g.desc) + '</p>' +
    '<div class="acts"><a class="shop" href="' + esc(g.url) + '" target="_blank" rel="noopener">Zobraziť v obchode</a>' +
    '<button class="sw" role="switch" aria-checked="' + on + '"><span class="t"></span>Tento mu kúpim</button></div></div></article>';
  el.querySelector(".sw").onclick = function(){
    if(picked[x.key]) delete picked[x.key]; else picked[x.key] = {name:g.name,url:g.url,emoji:g.emoji};
    savePicked();
    showWheelResult();
  };
}

$("confirm").addEventListener("click", function(){
  var items = Object.keys(picked).map(function(k){return picked[k]});
  if(!items.length){ toast("Ježiško nie je veštec – vyber aspoň jeden darček 😅"); return }
  $("s2").classList.add("hide"); $("float").classList.add("hide");
  var s3 = $("s3"); s3.classList.remove("hide");
  var rok = new Date().getFullYear();
  s3.innerHTML =
    '<div class="cert"><div class="seal">🏅</div><h2>Certifikát najlepšej manželky</h2>' +
    '<p>Týmto sa oficiálne potvrdzuje, že držiteľka tohto certifikátu je najlepšia manželka na svete a jej manžel si nič iné ani nezaslúži.</p>' +
    '<p><b>Darčeky schválené Ježiškom:</b></p><ul>' +
    items.map(function(it){return '<li><b>' + it.emoji + ' ' + esc(it.name) + '</b><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.url) + '</a></li>'}).join("") +
    '</ul><p class="sig">Podpísaný: Ježiško, s.r.o. – Vianoce ' + rok + '<br>Pečať: 🎅 (neodvolateľná)</p>' +
    '<button class="btn yes" id="copy">Skopírovať zoznam</button>' +
    '<button class="btn ghost" id="back">← Ešte si to rozmyslím</button></div>';
  scrollTo(0,0); confetti(); setTimeout(confetti, 600);
  $("copy").onclick = function(){
    var txt = "🎄 Santov objednávací formulár – zoznam darčekov:\n\n" +
      items.map(function(it,i){return (i+1) + ". " + it.name + "\n   " + it.url}).join("\n");
    copyText(txt);
  };
  $("back").onclick = function(){ s3.classList.add("hide"); $("s2").classList.remove("hide"); $("float").classList.remove("hide") };
});
function copyText(t){
  function fb(){
    var a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
    document.body.appendChild(a); a.select();
    var ok = false; try{ ok = document.execCommand("copy") }catch(e){}
    document.body.removeChild(a); toast(ok ? "Skopírované! Pošli to Ježiškovi 🎅" : "Kopírovanie sa nepodarilo, označ text ručne");
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast("Skopírované! Pošli to Ježiškovi 🎅")}, fb);
  } else fb();
}
var tt;
function toast(m){
  var o = document.querySelector(".toast"); if(o) o.remove();
  var e = document.createElement("div"); e.className = "toast"; e.textContent = m; document.body.appendChild(e);
  clearTimeout(tt); tt = setTimeout(function(){e.remove()}, 2600);
}
loadPicked(); buildTabs(); buildList();
